name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore dependencies
        run: dotnet restore PS4-PS5download0TOOL.sln

      - name: Publish Windows app
        run: >
          dotnet publish PS4-PS5download0TOOL.csproj
          -f net8.0-windows10.0.19041.0
          -c Release
          -r win10-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:WindowsPackageType=None
          -o publish/

      - name: Zip published output
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath PS4-PS5download0TOOL-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PS4-PS5download0TOOL ${{ github.ref_name }}"
          body: |
            ## PS4-PS5download0TOOL ${{ github.ref_name }}

            ### How to use
            1. Download the `.zip` file below
            2. Extract it to any folder
            3. Run `PS4-PS5download0TOOL.exe`

            ### Requirements
            - Windows 10 or newer (x64)
            - No .NET installation required (self-contained)
          files: PS4-PS5download0TOOL-${{ github.ref_name }}-win-x64.zip
          draft: false
          prerelease: false
